[build]
  publish = "public"
  functions = "netlify/functions"
  command = 'sed -i "s#__SITE_URL__#$URL#g" public/index.html'

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
[[redirects]]
  from = "/api/bot"
  to = "/.netlify/functions/bot"
  status = 200
[[redirects]]
  from = "/api/setup"
  to = "/.netlify/functions/telegram-setup"
  status = 200
